<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Основные стили для страницы */
    body {
      font-family: Arial, sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      background: linear-gradient(to top, #00008B, #ADD8E6);
      position: relative;
      overflow: hidden;
    }

    /* Верхняя панель с названием и меню */
    .header {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 30px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 2px solid #4682b4;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 1.8em;
      color: #1e3a5f;
      margin: 0 20px;
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 25px;
      height: 20px;
      cursor: pointer;
      margin-right: 20px;
    }

    .menu-icon div {
      height: 4px;
      background-color: #1e3a5f;
      border-radius: 2px;
      margin: 4px 0;
    }

    /* Пузырьки, перемещающиеся по экрану */
    .bubble {
      position: absolute;
      bottom: -100px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: floatUp 6s infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100vh); }
    }

    .bubble:nth-child(1) {
      width: 60px;
      height: 60px;
      left: 10%;
      animation-duration: 7s;
      animation-delay: 0s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(2) {
      width: 80px;
      height: 80px;
      left: 30%;
      animation-duration: 8s;
      animation-delay: 1s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(3) {
      width: 70px;
      height: 70px;
      left: 50%;
      animation-duration: 9s;
      animation-delay: 2s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(4) {
      width: 50px;
      height: 50px;
      left: 70%;
      animation-duration: 6s;
      animation-delay: 3s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(5) {
      width: 100px;
      height: 100px;
      left: 90%;
      animation-duration: 10s;
      animation-delay: 4s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 1200px;
      margin: 30px;
      z-index: 10;
      margin-top: 80px; /* Для отступа от верхней панели */
      flex-wrap: wrap;
    }

    /* Профиль пользователя */
    .profile-container {
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 40%; /* Уменьшаем ширину */
      margin-left: 30px; /* Отступ от таблицы */
      flex: 1;
    }

    .profile-container img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .profile-container h1 {
      font-size: 2em;
      color: #1e3a5f;
    }

    .class-info, .rating-info {
      font-size: 1.2em;
      margin: 10px 0;
      color: #1e3a5f;
    }

    /* Таблица успеваемости */
    .grades-table {
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 55%; /* Увеличиваем ширину таблицы */
      flex: 2;
    }

    .grades-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .grades-table th, .grades-table td {
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
    }

    .grades-table th {
      background-color: #4682b4;
      color: white;
    }

    .grades-table tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    /* График успеваемости */
    .chart-container {
      width: 80%;
      max-width: 900px;
      margin: 30px auto;
      flex: 2;
      order: 1; /* Размещаем график под таблицей */
    }

    /* Меню */
    .menu {
      display: none;
      background-color: rgba(255, 255, 255, 0.8);
      position: absolute;
      top: 50px;
      left: 30px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 200px;
    }

    .menu a {
      display: block;
      padding: 10px;
      color: #1e3a5f;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }

    .menu a:hover {
      background-color: #f0f0f0;
    }

    /* Адаптация для мобильных устройств */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .grades-table, .profile-container {
        width: 90%; /* Ширина для мобильных устройств */
        margin-bottom: 30px;
      }

      .chart-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <!-- Верхняя панель с названием и меню -->
  <div class="header">
    <div class="menu-icon" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1>Спасти Океан</h1>
  </div>

  <!-- Пузырьки на фоне -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <!-- Меню -->
  <div class="menu">
    <a href="map.html">Карта</a> <!-- Ссылка на страницу карты -->
    <a href="store.html">Магазин</a>
    <a href="rules.html">Правила</a>
    <a href="sea_friends.html">Подводные друзья</a>
    <a href="monsters.html">Монстры</a>
  </div>

  <!-- Контейнер с информацией о профиле и таблицей успеваемости -->
  <div class="container">
    <!-- Таблица успеваемости -->
    <div class="grades-table">
      <h2>Таблица успеваемости</h2>
      <table>
        <thead>
          <tr>
            <th>Предмет</th>
            <th>Оценка</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Математика</td>
            <td>5</td>
            <td>01.03.2025</td>
          </tr>
          <tr>
            <td>Физика</td>
            <td>4</td>
            <td>02.03.2025</td>
          </tr>
          <tr>
            <td>Литература</td>
            <td>5</td>
            <td>01.03.2025</td>
          </tr>
          <tr>
            <td>Химия</td>
            <td>4</td>
            <td>03.03.2025</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- График успеваемости -->
    <div class="chart-container">
      <canvas id="successChart"></canvas>
    </div>

    <!-- Профиль пользователя -->
    <div class="profile-container">
      <img src="https://www.example.com/user-photo.jpg" alt="Фотография пользователя">
      <h1>Добро пожаловать, Иван!</h1>
      <div class="class-info">Класс: 11-А</div>
      <div class="rating-info">Рейтинг успеха: 95%</div>
    </div>
  </div>

  <script>
    // Данные для графика
    const labels = ["01.03.2025", "02.03.2025", "01.03.2025", "03.03.2025"];
    const grades = [5, 4, 5, 4];

    const ctx = document.getElementById('successChart').getContext('2d');

    const successChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Оценки',
          data: grades,
          borderColor: 'rgba(30, 58, 95, 1)',
          backgroundColor: 'rgba(30, 58, 95, 0.2)',
          borderWidth: 2,
          tension: 0.24,
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            title: {
              display: true,
              text: 'Дата'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Оценка'
            },
            min: 0,
            max: 5
          }
        }
      }
    });

    // Функция для переключения видимости меню
    function toggleMenu() {
      const menu = document.querySelector('.menu');
      menu.style.display = (menu.style.display === 'block' ? 'none' : 'block');
    }
  </script>
</body>
</html>
