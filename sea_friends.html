<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подводные друзья</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 0;
      background: linear-gradient(to top, #00008B, #ADD8E6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .header {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 30px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 2px solid #4682b4;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 1.8em;
      color: #1e3a5f;
      margin: 0 20px;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: floatUp 6s infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100vh); }
    }

    .bubble:nth-child(1) {
      width: 60px;
      height: 60px;
      left: 10%;
      animation-duration: 7s;
      animation-delay: 0s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(2) {
      width: 80px;
      height: 80px;
      left: 30%;
      animation-duration: 8s;
      animation-delay: 1s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(3) {
      width: 70px;
      height: 70px;
      left: 50%;
      animation-duration: 9s;
      animation-delay: 2s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(4) {
      width: 50px;
      height: 50px;
      left: 70%;
      animation-duration: 6s;
      animation-delay: 3s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(5) {
      width: 100px;
      height: 100px;
      left: 90%;
      animation-duration: 10s;
      animation-delay: 4s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 25px;
      height: 20px;
      cursor: pointer;
      margin-right: 20px;
    }

    .menu-icon div {
      height: 4px;
      background-color: #1e3a5f;
      border-radius: 2px;
      margin: 4px 0;
    }

    .friends-container {
      margin-top: 100px;
      width: 80%;
      max-width: 1200px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 20px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .friend-item img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-right: 20px;
    }

    .friend-item h2 {
      font-size: 1.5em;
      color: #1e3a5f;
      margin: 0;
    }

    .friend-item p {
      font-size: 1.1em;
      color: #1e3a5f;
    }

    .menu {
      display: none;
      background-color: rgba(255, 255, 255, 0.8);
      position: absolute;
      top: 50px;
      left: 30px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 200px;
    }

    .menu a {
      display: block;
      padding: 10px;
      color: #1e3a5f;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }

    .menu a:hover {
      background-color: #f0f0f0;
    }

    /* Адаптация для мобильных устройств */
    @media (max-width: 768px) {
      .friends-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="menu-icon" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1>Спасти Океан</h1>
  </div>

  <!-- Меню -->
  <div class="menu">
    <a href="profile.html">Личный кабинет</a>
    <a href="map.html">Карта</a> 
    <a href="store.html">Магазин</a>
    <a href="rules.html">Правила</a>
  </div>

  <!-- Контейнер с подводными друзьями -->
  <div class="friends-container">
    <div class="friend-item">
      <img src="https://www.example.com/dolphin.jpg" alt="Дельфин">
      <div>
        <h2>Дельфин</h2>
        <p>Получено: 10.03.2025</p>
      </div>
    </div>

    <div class="friend-item">
      <img src="https://www.example.com/turtle.jpg" alt="Черепаха">
      <div>
        <h2>Черепаха</h2>
        <p>Получено: 12.03.2025</p>
      </div>
    </div>

    <div class="friend-item">
      <img src="https://www.example.com/shark.jpg" alt="Акула">
      <div>
        <h2>Акула</h2>
        <p>Получено: 15.03.2025</p>
      </div>
    </div>

    <!-- Дополнительные морские персонажи -->
  </div>

  <!-- Пузырьки -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <script>
    // Функция для переключения видимости меню
    function toggleMenu() {
      const menu = document.querySelector('.menu');
      menu.style.display = (menu.style.display === 'block' ? 'none' : 'block');
    }
  </script>
</body>
</html>
