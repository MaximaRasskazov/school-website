<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Монстры</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #2c3e50;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      background: linear-gradient(to top, #00008B, #ADD8E6);
    }

    /* Верхняя панель с названием и меню */
    .header {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 30px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 2px solid #4682b4;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 1.8em;
      color: #1e3a5f;
      margin: 0 20px;
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 25px;
      height: 20px;
      cursor: pointer;
      margin-right: 20px;
    }

    .menu-icon div {
      height: 4px;
      background-color: #1e3a5f;
      border-radius: 2px;
      margin: 4px 0;
    }

    /* Меню */
    .menu {
      display: none;
      background-color: rgba(255, 255, 255, 0.8);
      position: absolute;
      top: 50px;
      left: 30px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 200px;
    }

    .menu a {
      display: block;
      padding: 10px;
      color: #1e3a5f;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }

    .menu a:hover {
      background-color: #f0f0f0;
    }

    .monster-container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      text-align: center;
      width: 60%;
      max-width: 600px;
      margin-top: 100px; /* Для отступа от верхней панели */
    }

    .monster-container img {
      width: 200px;
      height: 200px;
      border-radius: 10px;
    }

    .health-bar {
      background-color: #e74c3c;
      height: 20px;
      width: 100%;
      margin: 20px 0;
      border-radius: 10px;
      position: relative;
    }

    .health-bar div {
      background-color: #2ecc71;
      height: 100%;
      border-radius: 10px;
    }

    input[type="number"] {
      padding: 10px;
      width: 60%;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      background-color: #4682b4;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #5a9fd3;
    }

    .rules {
      margin-top: 20px;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
    }

    .rules h3 {
      color: #1e3a5f;
    }

    /* Пузырьки на фоне */
    .bubble {
      position: absolute;
      bottom: -100px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: floatUp 6s infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100vh); }
    }

    .bubble:nth-child(1) {
      width: 60px;
      height: 60px;
      left: 10%;
      animation-duration: 7s;
      animation-delay: 0s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(2) {
      width: 80px;
      height: 80px;
      left: 30%;
      animation-duration: 8s;
      animation-delay: 1s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(3) {
      width: 70px;
      height: 70px;
      left: 50%;
      animation-duration: 9s;
      animation-delay: 2s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(4) {
      width: 50px;
      height: 50px;
      left: 70%;
      animation-duration: 6s;
      animation-delay: 3s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    .bubble:nth-child(5) {
      width: 100px;
      height: 100px;
      left: 90%;
      animation-duration: 10s;
      animation-delay: 4s;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.5) 70%);
    }

    /* Стиль для победы */
    .victory-message {
      font-size: 1.5em;
      color: #2ecc71;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Верхняя панель с названием и меню -->
  <div class="header">
    <div class="menu-icon" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1>Спасти Океан</h1>
  </div>
  
  <!-- Пузырьки на фоне -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <!-- Меню -->
  <div class="menu">
    <a href="map.html">Карта</a>
    <a href="profile.html">Личный кабинет</a>
    <a href="rules.html">Правила</a>
    <a href="store.html">Магазин</a>
    <a href="sea_friends.html">Подводные друзья</a>
  </div>

  <div class="monster-container">
    <h2>Монстр Океана</h2>
    <img src="https://www.example.com/monster.jpg" alt="Монстр">
    
    <div class="health-bar">
      <div id="health-bar"></div>
    </div>
    
    <!-- Инпут для задания начального здоровья -->
    <input type="number" id="initialHealth" placeholder="Введите начальный уровень здоровья">
    <button onclick="setInitialHealth()">Установить здоровье</button>

    <br>
    <input type="number" id="coinsInput" placeholder="Введите количество монет">
    <button onclick="reduceHealth()">Потратить монеты</button>

    <div class="rules">
      <h3>Правила атаки монстра:</h3>
      <ul>
        <li>Монстр атакует учеников раз в день.</li>
        <li>При атаке забирает 1 монету за каждую попытку уменьшить его здоровье.</li>
        <li>Монстр атакует, если его здоровье меньше 30%.</li>
      </ul>
    </div>
    
    <!-- Сообщение о победе -->
    <div id="victory-message" class="victory-message"></div>
  </div>

  <script>
    let monsterHealth = 100; // Изначальное здоровье монстра

    // Функция для переключения видимости меню
    function toggleMenu() {
      const menu = document.querySelector('.menu');
      menu.style.display = (menu.style.display === 'block' ? 'none' : 'block');
    }

    // Функция для установки начального уровня здоровья
    function setInitialHealth() {
      const initialHealth = document.getElementById('initialHealth').value;
      if (initialHealth && initialHealth > 0) {
        monsterHealth = initialHealth;
        updateHealthBar();
        document.getElementById('initialHealth').value = ''; // Очищаем поле ввода
      } else {
        alert('Пожалуйста, введите корректное значение для здоровья!');
      }
    }

    // Функция для уменьшения здоровья
    function reduceHealth() {
      const coins = document.getElementById('coinsInput').value;
      if (coins && coins > 0) {
        monsterHealth -= coins;
        if (monsterHealth < 0) monsterHealth = 0;
        updateHealthBar();

        // Очищаем поле ввода
        document.getElementById('coinsInput').value = '';
      } else {
        alert('Пожалуйста, введите количество монет!');
      }
    }

    // Обновляем полоску здоровья
    function updateHealthBar() {
      const healthBar = document.getElementById('health-bar');
      healthBar.style.width = monsterHealth + '%';

      // Проверка на победу
      if (monsterHealth === 0) {
        document.getElementById('victory-message').textContent = 'Ура, вы победили монстра и расколдовали его в своего друга!';
      }
    }
  </script>
</body>
</html>
